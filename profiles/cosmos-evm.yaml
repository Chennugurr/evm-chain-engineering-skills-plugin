stack_id: cosmos-evm
display_name: Cosmos EVM Appchain
status: reference-alpha
chain_types:
- l1
- appchain
execution:
  evm: true
  clients:
  - cosmos-sdk-evm-module
settlement:
  supported:
  - native-cometbft
  notes:
  - IBC and hub relationships must be explicit.
data_availability:
  supported:
  - native-cometbft-chain
  notes:
  - DA follows validator/full-node data propagation.
proof_models:
  supported:
  - cometbft-finality
  notes:
  - Security follows validator set and staking economics.
required_roles:
- validator
- full-node
- rpc-node
- rest-api
- explorer
- monitoring
- governance-operator
optional_roles:
- ibc-relayer
- archive-node
- faucet
security_required:
- validator-key-custody
- ibc-risk-review
- module-upgrade-review
- governance-review
- rpc-security-review
forbidden_defaults:
- private-key-in-env
- mnemonic-in-repo
- public-admin-rpc
- unpinned-docker-image
- mainnet-broadcast-without-approval
source_refs:
- docs/upstream-sources.md#cosmos-evm
notes:
- Planning profile only. Verify against current upstream docs before production.
