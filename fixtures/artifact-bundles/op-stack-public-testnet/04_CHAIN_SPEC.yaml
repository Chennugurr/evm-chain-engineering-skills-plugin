workflow_id: op-stack-public-testnet
chain_name: Example OP Stack Public Testnet
chain_id: <ASSIGN_UNIQUE_CHAIN_ID_AFTER_COLLISION_CHECK>
chain_type: l2
environment: public-testnet
stack_id: op-stack
settlement:
  layer: ethereum-sepolia
  finality_assumption: Verify against current upstream docs before deployment.
  mainnet: false
data_availability:
  mode: ethereum-calldata-or-blobs
  provider: VERIFY_CURRENT_DOCS
proof_model:
  type: optimistic
  assumptions: Planning-only. Verify proof/fraud/validity assumptions for the selected
    release.
execution:
  evm: true
  clients:
  - op-geth
  - op-reth
sequencing:
  model: centralized-sequencer-for-alpha-fixture
  decentralization_roadmap_required: true
gas_token:
  type: native-or-custom-if-supported
  symbol_placeholder: TEST
  real_token_contract: null
governance:
  admin_model: multisig-plus-timelock-required-before-production
  emergency_pause: documented-only
  consensus_model: inherits-rollup-stack-assumptions
node_roles:
- sequencer
- execution-client
- op-node
- batcher
- proposer
- rpc-node
- explorer
- monitoring
security:
  private_keys_in_repo: false
  mnemonics_in_repo: false
  signer_policy: use-kms-hsm-or-hardware-wallet-for-real-deployment
  admin_rpc_public: false
  validator_key_custody: external-custody-required
operational_limits:
  generated_for: planning-and-validation-only
  not_for: direct-mainnet-deployment
human_approval_required: true
