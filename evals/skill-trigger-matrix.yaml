  review_notes: ZK prover prompts must not become optimistic fraud-proof answers.
- id: evm-l1-launch-plan
  prompt: Build a plan for a new EVM L1 similar to BNB Smart Chain or an Avalanche-style
    appchain. Include consensus, validators, genesis, native token, RPC, bootnodes,
    explorer, monitoring, and launch gates.
  expected_skills:
  - evm-l1-builder
  - chain-infra-ops
  - blockchain-architect
  - chain-launch-manager
  - explorer-indexer-engineer
  forbidden_skills:
  - op-stack-engineer
  - zksync-zk-stack-engineer
  must_include:
  - consensus
  - validator set
  - genesis
  - chain ID
  - bootnodes
  - native token
  - RPC
  - launch gates
  must_not_include:
  - just deploy contracts
  - rollup settlement
  required_behavior:
  - Include chain ID collision checks.
  - No real keys.
  - Include launch gates.
  safety_level: production
  review_notes: Economics intent maps into evm-l1-builder and blockchain-architect.
- id: bridge-risk-review
  prompt: Review the bridge and interoperability risks for a new L2 that will connect
    to Ethereum and multiple third-party bridges.
  expected_skills:
