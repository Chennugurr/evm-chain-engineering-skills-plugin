- id: zksync-prover-aware-chain
  prompt: Plan a ZKsync ZK Stack chain and include prover requirements, proof latency,
    proof submission, bridge assumptions, and server sizing caveats.
  expected_skills:
  - zksync-zk-stack-engineer
  - chain-infra-ops
  - observability-sre
  - chain-security-reviewer
  forbidden_skills:
  - op-stack-engineer
  - arbitrum-orbit-engineer
  must_include:
