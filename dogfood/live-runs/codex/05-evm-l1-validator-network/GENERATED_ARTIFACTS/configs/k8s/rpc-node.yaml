apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-l1-posa-testnet-rpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evm-l1-posa-testnet-rpc
  template:
    metadata:
      labels:
        app: evm-l1-posa-testnet-rpc
    spec:
      containers:
        - name: rpc-node
          image: example/bnb-style-posa-rpc:v0.0.0-placeholder
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          env:
            - name: SIGNER_MODE
              value: external-signer-required
